<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks — ctx</title>
  <meta name="description" content="You're on the waitlist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00FF41;
      --green-dim: #00CC34;
      --bg: #0A0A0A;
      --surface: #111111;
      --border: #222;
      --text: #E0E0E0;
      --text-dim: #999;
      --radius: 8px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px;
      text-align: center;
      max-width: 480px;
    }
    .check {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
      color: var(--green);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      background: var(--green);
      color: #000;
      transition: background .2s;
    }
    .btn:hover { background: var(--green-dim); }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>You're on the list</h1>
    <p>We'll let you know when Pro features launch. In the meantime, <span class="mono">ctx</span> is ready to use.</p>
    <a href="/" class="btn">Back to ctx</a>
  </div>
</body>
</html>
